[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colorimeter-gui"
version = "0.1.0"
description = "Three-sector donut load-cell control panel"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "pyserial>=3.5",
    "numpy>=1.24",
]

[project.scripts]
colorimeter-gui = "colorimeter_gui.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
